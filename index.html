<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OTP Web App</title>

<style>
body{
    font-family: Arial;
    text-align:center;
    margin-top:60px;
    background:#111;
    color:white;
}

input, button{
    padding:12px;
    width:80%;
    margin:10px;
    font-size:16px;
    border-radius:6px;
    border:none;
}

button{
    background:#00c853;
    color:white;
}

.box{
    background:#222;
    padding:20px;
    margin:20px;
    border-radius:10px;
}
</style>
</head>

<body>

<div class="box">
<h2>📱 OTP WEB APP</h2>

<input id="phone" placeholder="Enter phone number">

<br>

<button onclick="sendOTP()">Send OTP</button>

<p id="msg"></p>
</div>

<script>
function sendOTP(){
    let phone = document.getElementById("phone").value;

    if(phone.length < 5){
        document.getElementById("msg").innerText = "❌ Invalid number";
        return;
    }

    // GitHub demo mode (no backend available)
    document.getElementById("msg").innerText =
        "📤 OTP request sent to: " + phone + " (demo mode)";
}
</script>

</body>
</html>

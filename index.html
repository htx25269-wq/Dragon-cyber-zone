<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon Ethical AI - Live</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .chat-container { width: 450px; background: white; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); overflow: hidden; display: flex; flex-direction: column; border: 1px solid #e5e7eb; }
        .chat-header { background: linear-gradient(135deg, #064e3b, #065f46); color: white; padding: 25px 20px; text-align: center; }
        .chat-header h2 { margin: 0; font-size: 1.4rem; letter-spacing: 1px; }
        .chat-header p { margin: 5px 0 0; font-size: 0.85rem; opacity: 0.9; }
        .chat-box { flex: 1; padding: 20px; overflow-y: auto; height: 450px; background: #ffffff; display: flex; flex-direction: column; }
        .message { margin-bottom: 15px; padding: 12px 18px; border-radius: 18px; font-size: 15px; line-height: 1.6; max-width: 80%; word-wrap: break-word; }
        .ai-msg { background: #ecfdf5; color: #064e3b; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #d1fae5; }
        .user-msg { background: #065f46; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .input-area { display: flex; padding: 20px; background: #f9fafb; border-top: 1px solid #edf2f7; }
        input { flex: 1; padding: 12px 20px; border: 1px solid #d1d5db; border-radius: 30px; outline: none; font-size: 14px; transition: 0.2s; }
        input:focus { border-color: #059669; box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.1); }
        button { background: #059669; color: white; border: none; padding: 10px 25px; margin-left: 12px; border-radius: 30px; cursor: pointer; font-weight: 600; transition: 0.3s; }
        button:hover { background: #047857; transform: translateY(-1px); }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <h2>DRAGON ETHICAL AI</h2>
        <p>Integrity • Fairness • Community</p>
    </div>
    <div id="chatBox" class="chat-box">
        <div class="message ai-msg">আসসালামু আলাইকুম! আমি ড্রাগন এথিক্যাল জোন-এর কৃত্রিম বুদ্ধিমত্তা। আপনাকে আজ কীভাবে সাহায্য করতে পারি?</div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="আপনার প্রশ্নটি এখানে লিখুন..." onkeypress="if(event.key === 'Enter') askAI()">
        <button onclick="askAI()">পাঠান</button>
    </div>
</div>

<script>
    // আপনার পাওয়া API Key-টি নিচের ইনভার্টেড কমার ভেতরে বসান
    const API_KEY = "AIzaSyC3PQgvAscm-IMedt25DsiXLEpoeSzcAng"; 

    async function askAI() {
        const inputField = document.getElementById('userInput');
        const chatBox = document.getElementById('chatBox');
        const userText = inputField.value.trim();

        if (!userText) return;

        appendMessage(userText, 'user-msg');
        inputField.value = "";

        const loadingDiv = appendMessage("ড্রাগন এআই উত্তর তৈরি করছে...", 'ai-msg');

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: `তুমি Dragon Ethical Zone-এর একজন অফিসিয়াল AI। তোমার আচরণ হবে অত্যন্ত মার্জিত, সৎ এবং ন্যায়পরায়ণ। সব প্রশ্নের উত্তর দেওয়ার সময় নৈতিকতাকে গুরুত্ব দেবে। প্রশ্ন: ${userText}` }] }]
                })
            });

            const data = await response.json();
            const aiResponse = data.candidates[0].content.parts[0].text;
            
            loadingDiv.innerText = aiResponse;
        } catch (error) {
            loadingDiv.innerText = "দুঃখিত, কোনো একটি সমস্যা হয়েছে। অনুগ্রহ করে আপনার ইন্টারনেট সংযোগ অথবা API Key চেক করুন।";
        }

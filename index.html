<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon Ethical Zone - AI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: white; display: flex; flex-direction: column; height: 100vh; }
        
        /* Header */
        header { background: #1e293b; padding: 15px; text-align: center; border-bottom: 2px solid #ff3e3e; box-shadow: 0 4px 15px rgba(255, 62, 62, 0.2); }
        header h1 { color: #ff3e3e; font-size: 1.5rem; letter-spacing: 1px; }

        /* Chat Window */
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 80%; padding: 12px 16px; border-radius: 15px; line-height: 1.5; font-size: 15px; position: relative; }
        .user-message { background: #ff3e3e; align-self: flex-end; border-bottom-right-radius: 2px; }
        .ai-message { background: #334155; align-self: flex-start; border-bottom-left-radius: 2px; white-space: pre-wrap; }

        /* Input Area */
        .input-area { background: #1e293b; padding: 20px; display: flex; gap: 10px; border-top: 1px solid #334155; }
        input { flex: 1; background: #0f172a; border: 1px solid #475569; padding: 12px; border-radius: 8px; color: white; outline: none; }
        input:focus { border-color: #ff3e3e; }
        button { background: #ff3e3e; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        button:hover { background: #cc0000; }

        /* Loader */
        .typing { font-style: italic; color: #94a3b8; font-size: 13px; display: none; }
    </style>
</head>
<body>

<header>
    <h1>DRAGON ETHICAL ZONE AI</h1>
</header>

<div id="chat-container">
    <div class="message ai-message">Hello! I am Dragon AI. How can I help you today?</div>
</div>

<div class="input-area">
    <div id="status" class="typing">Dragon is thinking...</div>
    <input type="text" id="userInput" placeholder="Ask me anything...">
    <button onclick="sendMessage()">SEND</button>
</div>

<script>
    const chatContainer = document.getElementById('chat-container');
    const userInput = document.getElementById('userInput');
    const status = document.getElementById('status');

    // এখানে তোমার Google Gemini API Key বসাও
    const API_KEY = "AIzaSyC3PQgvAscm-IMedt25DsiXLEpoeSzcAng"; 
    const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;

    async function sendMessage() {
        const message = userInput.value.trim();
        if (!message) return;

        // ইউজারের মেসেজ স্ক্রিনে দেখানো
        appendMessage(message, 'user-message');
        userInput.value = '';
        status.style.display = 'block';

        try {
            const response = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: message }] }]
                })
            });

            const data = await response.json();
            const aiResponse = data.candidates[0].content.parts[0].text;
            
            appendMessage(aiResponse, 'ai-message');
        } catch (error) {
            appendMessage("Sorry, I am having trouble connecting. Check your API key.", 'ai-message');
            console.error(error);
        } finally {
            status.style.display = 'none';
        }
    }

    function appendMessage(text, className) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${className}`;
        msgDiv.innerText = text;
        chatContainer.appendChild(msgDiv);
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    // Enter চাপলে মেসেজ যাবে
    userInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter") sendMessage();
    });
</script>

</body>
</html>
